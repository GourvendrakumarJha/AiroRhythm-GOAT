name: Android APK

# Builds an installable APK of AiroRhythm Connect (the connect/ web app inside a
# WebView). Run it from the Actions tab → "Android APK" → Run workflow, then download
# the "airorhythm-connect-apk" artifact at the bottom of the run.
#
# Nothing is uploaded to a store and no secrets are needed: the debug APK is signed with
# the standard debug key, which is fine for sideloading on your own phone.

on:
  workflow_dispatch:
  push:
    paths:
      - 'connect/index.html'
      - 'connect/assets/**'
      - 'connect/android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'connect/index.html'
      - 'connect/assets/**'
      - 'connect/android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show the SDK we are building against
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - name: Build the debug APK
        working-directory: connect/android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Check the APK and report what went in
        working-directory: connect/android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          unzip -l "$APK" | grep -E "index.html|logo_mark.png|classes.dex|AndroidManifest" || true
          echo "sha256: $(sha256sum "$APK" | cut -d' ' -f1)"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: airorhythm-connect-apk
          path: connect/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
